<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="jtc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Glass Cloud Gradient -->
    <linearGradient id="jtc-cloud" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.12" />
    </linearGradient>

    <!-- Glass Glow Filter -->
    <filter id="jtc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Trajectory Gradient -->
    <linearGradient id="jtc-line" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#67e8f9" />
    </linearGradient>
  </defs>

  <!-- Base Rounded Squircle Background -->
  <rect width="128" height="128" rx="32" fill="url(#jtc-bg)" />
  
  <!-- Subtle Inner Border for High-End Glass Feel -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="30.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-opacity="0.25" />

  <!-- Frosted Glass Cloud Background -->
  <path d="M42 88h46a22 22 0 0 0 5.5-43.3A26 26 0 0 0 43.5 48 18 18 0 0 0 42 88z" 
        fill="url(#jtc-cloud)" 
        stroke="#ffffff" 
        stroke-width="2" 
        stroke-opacity="0.45" />

  <!-- Cloud Highlights & Depth -->
  <path d="M48 46a24 24 0 0 1 42 4" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="2.5" 
        stroke-linecap="round" 
        stroke-opacity="0.6" />

  <!-- Career Briefcase -->
  <!-- Handle -->
  <path d="M54 55v-6a4 4 0 0 1 4-4h16a4 4 0 0 1 4 4v6" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="5" 
        stroke-linecap="round" />
  
  <!-- Briefcase Main Body -->
  <rect x="40" y="55" width="48" height="34" rx="7" fill="#ffffff" />
  
  <!-- Briefcase Accent Flap Line -->
  <path d="M40 67c7 5 17 8 24 8s17-3 24-8" 
        fill="none" 
        stroke="#1d4ed8" 
        stroke-width="3" 
        stroke-opacity="0.4" />
  
  <!-- Briefcase Clasp -->
  <rect x="60" y="66" width="8" height="7" rx="2" fill="#1d4ed8" />
  <rect x="62" y="68" width="4" height="2" rx="0.5" fill="#ffffff" />

  <!-- Career Motion & Trajectory Wave (Upward Growth) -->
  <path d="M30 94 Q 52 92 68 76 T 98 56" 
        fill="none" 
        stroke="url(#jtc-line)" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        filter="url(#jtc-glow)" />

  <!-- Launch / Speed Accent Dashes -->
  <line x1="42" y1="102" x2="52" y2="92" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8" />
  <line x1="56" y1="102" x2="66" y2="92" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- Minimalist Light Accent Glints -->
  <circle cx="86" cy="40" r="2.5" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="34" cy="62" r="1.8" fill="#67e8f9" fill-opacity="0.8" />
  <circle cx="94" cy="74" r="2" fill="#67e8f9" fill-opacity="0.8" />
</svg>
